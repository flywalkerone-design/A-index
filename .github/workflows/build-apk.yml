name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www/js
          cp -r www/* android/app/src/main/assets/www/
          echo "=== assets/www/ ===" && ls android/app/src/main/assets/www/
          echo "=== assets/www/js/ ===" && ls android/app/src/main/assets/www/js/

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-Stock-Thermometer-v1.5
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
