name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_seq:
        description: '同一天多次构建的序号（V1/V2/V3，默认 1）'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy web assets to Android & write local.properties
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r www/. android/app/src/main/assets/www/
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "=== assets/www ===" && ls android/app/src/main/assets/www

      - name: Compute build parameters
        id: build
        run: |
          echo "build_date=$(date +%m%d)" >> "$GITHUB_OUTPUT"
          echo "build_seq=${{ github.event.inputs.version_seq || '1' }}" >> "$GITHUB_OUTPUT"
          echo "keystore=$RUNNER_TEMP/sign-keystore.jks" >> "$GITHUB_OUTPUT"
          artifact="index-crowding-$(date +%m%d)"
          [ "${{ github.event.inputs.version_seq || '1' }}" != "1" ] && artifact="${artifact}V${{ github.event.inputs.version_seq || '1' }}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      # 每次构建生成全新 keystore → 每个版本签名独立（多版本并存、老版本可回退）
      - name: Generate unique signing keystore (per-build signature)
        run: |
          keytool -genkeypair -v \
            -keystore "${{ steps.build.outputs.keystore }}" \
            -alias release -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ github.run_id }}" -keypass "${{ github.run_id }}" \
            -dname "CN=StockTemp,O=IndexCrowding,L=CN,C=CN"

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.5

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildDate=${{ steps.build.outputs.build_date }} \
            -PbuildSeq=${{ steps.build.outputs.build_seq }} \
            -PsignKeystore=${{ steps.build.outputs.keystore }} \
            -PsignStorePass=${{ github.run_id }} \
            -PsignKeyAlias=release \
            -PsignKeyPass=${{ github.run_id }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
